name: Bug report
description: Something is broken or the game crashed
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug: the mod is in alpha, and every report helps.
  - type: input
    id: version
    attributes:
      label: Mod version
      description: The mod.io file version, the archive name, or the first line of RoNPvPLog.sav
      placeholder: 0.3.0-alpha
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Your role in the game
      options:
        - Host, playing alone with bots
        - Host, with other players
        - Client (subscribed to the mod)
        - Client (no mod, "Join modded servers")
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened. Map, side, round.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Campus, "Elephant", host as a suspect, bots on.
        2. ...
  - type: textarea
    id: logs
    attributes:
      label: Host logs
      description: |
        Drag the files from the host's computer here:
        `%LOCALAPPDATA%\ReadyOrNot\Saved\SaveGames\RoNPvPLog.sav` (the mode's log)
        With the legacy UE4SS installer version also:
        `<game>\ReadyOrNot\Binaries\Win64\ue4ss\UE4SS.log`
        `<game>\ReadyOrNot\Binaries\Win64\ue4ss\Mods\HostBrain\native\RonCompNative.log`
        Screenshots help too.
  - type: input
    id: game
    attributes:
      label: Game version
      description: If you know it (main menu, at the bottom)
