// RoN Competitive — default match settings (CS2 competitive equivalents).
// Format: <cvar> <value>   // comment
// Times are in seconds unless the name says otherwise. mp_roundtime is in minutes, as in CS.

// --- Match structure
mp_maxrounds                    24      // regulation rounds; halftime after half of them
mp_match_can_clinch             1       // end as soon as a team cannot be caught
mp_overtime_enable              1
mp_overtime_maxrounds           6       // MR3: 6 rounds per overtime, swap after 3
mp_overtime_startmoney          12500
mp_warmuptime                   60
mp_freezetime                   15
mp_roundtime                    1.92    // 1:55
mp_c4timer                      40
mp_buytime                      20      // seconds of live round after freeze time during which buying is allowed
mp_round_restart_delay          7
mp_halftime_duration            15
mp_plant_time                   3.2     // applied by the bomb adapter
mp_defuse_time                  10
mp_defuse_kit_time              5

// --- Teams
mp_attackers_faction            0       // 0 = suspects attack (plant), SWAT defends; 1 = SWAT attacks
mp_team0_starts_attacking       1
mp_friendlyfire                 1
ff_damage_reduction_bullets     0.33

// --- Money
mp_startmoney                   800
mp_maxmoney                     16000
mp_starting_losses              1       // loss counter at the start of each half (pistol loser gets $1,900)
mp_loss_bonus_max_losses        5       // counter cap: 1400 + 500*(5-1) = 3400
mp_loss_bonus_decrement_on_win  1       // 1 = a win lowers the counter by 1; 0 = a win resets it to 0
mp_attackers_survivor_no_bonus  1       // attackers alive when time runs out get no loss bonus
mp_warmup_money                 16000

cash_team_elimination           3250
cash_team_win_by_time           3250
cash_team_attackers_win_bomb    3500
cash_team_defenders_win_defuse  3500
cash_team_loser_bonus           1400
cash_team_loser_bonus_step      500
cash_team_planted_bomb_but_lost 800
cash_team_defenders_per_kill    0       // CS2 (07.2025) reportedly pays CTs $50 per T killed; off until confirmed
cash_player_bomb_planted        300
cash_player_bomb_defused        300
cash_player_killed_teammate     -300
cash_player_killed_enemy_default 300    // weapons missing from items.csv

// --- Inventory limits (enforced at purchase time) and stats
mp_max_grenades                 4
mp_assist_damage_threshold      41      // damage strictly above 40 counts as an assist
mp_damage_cap_per_victim        100     // damage past the victim's health does not count toward ADR
